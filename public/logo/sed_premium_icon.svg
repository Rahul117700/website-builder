<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d4d" />
            <stop offset="50%" stop-color="#e50914" />
            <stop offset="100%" stop-color="#8b0000" />
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="1"/>
        </filter>

        <clipPath id="shape">
            <rect width="512" height="512" rx="100" />
        </clipPath>
    </defs>

    <!-- Deepest Black Base -->
    <rect width="512" height="512" rx="100" fill="#000000" />

    <!-- HIGH VISIBILITY STRIPES (Thicker and much more opaque) -->
    <g clip-path="url(#shape)">
        <!-- Red primary stripes (75% opacity) -->
        <rect x="50"  y="0" width="20" height="512" fill="#ef4444" opacity="0.75" />
        <rect x="230" y="0" width="25" height="512" fill="#ef4444" opacity="0.80" />
        <rect x="420" y="0" width="18" height="512" fill="#ef4444" opacity="0.70" />
        
        <!-- Blue accent (50% opacity) -->
        <rect x="100" y="0" width="10" height="512" fill="#3b82f6" opacity="0.55" />
        <rect x="465" y="0" width="8"  height="512" fill="#3b82f6" opacity="0.45" />

        <!-- Green accent -->
        <rect x="160" y="0" width="10" height="512" fill="#22c55e" opacity="0.45" />
        
        <!-- Purple/Violet -->
        <rect x="310" y="0" width="12" height="512" fill="#a855f7" opacity="0.55" />
        
        <!-- Amber/Orange -->
        <rect x="365" y="0" width="12" height="512" fill="#f59e0b" opacity="0.60" />
    </g>

    <!-- Subtle inner neon glow around the border -->
    <rect width="512" height="512" rx="100" fill="none" stroke="#e50914" stroke-width="4" opacity="0.15" />

    <!-- Letter S - Bold & Sharp -->
    <text
        x="50%" y="50%"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        font-size="340"
        fill="url(#sGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        filter="url(#shadow)"
        style="letter-spacing: -10px;"
    >S</text>

    <!-- Subtext SED - Crisp White -->
    <text
        x="50%" y="84%"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="50"
        fill="#ffffff"
        letter-spacing="16"
        text-anchor="middle"
        dominant-baseline="middle"
    >SED</text>
</svg>
