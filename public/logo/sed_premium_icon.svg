<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <!-- S letter gradient: bright red -->
        <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d4d" />
            <stop offset="50%" stop-color="#e50914" />
            <stop offset="100%" stop-color="#8b0000" />
        </linearGradient>

        <!-- Drop shadow for S -->
        <filter id="shadow">
            <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.95"/>
        </filter>

        <!-- Clip path: rounded square -->
        <clipPath id="appShape">
            <rect width="512" height="512" rx="112" ry="112" />
        </clipPath>
    </defs>

    <!-- Pure black base -->
    <rect width="512" height="512" rx="112" ry="112" fill="#000000" />

    <!-- Cinematic spectral stripes, CLIPPED to shape, visible opacity -->
    <g clip-path="url(#appShape)">
        <!-- Red accent (prominent) -->
        <rect x="42"  y="0" width="14" height="512" fill="#ef4444" opacity="0.55" />
        <!-- Blue thin -->
        <rect x="88"  y="0" width="6"  height="512" fill="#3b82f6" opacity="0.35" />
        <!-- Green thin -->
        <rect x="148" y="0" width="5"  height="512" fill="#22c55e" opacity="0.28" />
        <!-- Dark red thin -->
        <rect x="198" y="0" width="3"  height="512" fill="#7f1d1d" opacity="0.40" />
        <!-- Red center (prominent) -->
        <rect x="238" y="0" width="16" height="512" fill="#ef4444" opacity="0.60" />
        <!-- Purple thin -->
        <rect x="292" y="0" width="5"  height="512" fill="#a855f7" opacity="0.35" />
        <!-- Amber -->
        <rect x="345" y="0" width="7"  height="512" fill="#f59e0b" opacity="0.42" />
        <!-- Red right -->
        <rect x="410" y="0" width="12" height="512" fill="#ef4444" opacity="0.52" />
        <!-- Cyan thin -->
        <rect x="460" y="0" width="4"  height="512" fill="#06b6d4" opacity="0.28" />
    </g>

    <!-- Inner border for premium feel -->
    <rect width="496" height="496" x="8" y="8" rx="104" ry="104"
          fill="none" stroke="#1a1a1a" stroke-width="1.5" />

    <!-- Letter S -->
    <text
        x="50%" y="52%"
        font-family="Impact, Arial Black, sans-serif"
        font-weight="900"
        font-size="340"
        fill="url(#sGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        filter="url(#shadow)"
        style="letter-spacing: -10px;"
    >S</text>

    <!-- Subtext SED -->
    <text
        x="50%" y="83%"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="44"
        fill="#ffffff"
        letter-spacing="14"
        text-anchor="middle"
        dominant-baseline="middle"
        opacity="0.97"
    >SED</text>
</svg>
