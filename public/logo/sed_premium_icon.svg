<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- Dark premium background with gradient -->
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2a2a2a" />
            <stop offset="100%" stop-color="#0a0a0a" />
        </radialGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d4d" />
            <stop offset="50%" stop-color="#e50914" />
            <stop offset="100%" stop-color="#8b0000" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.9"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />
    
    <!-- Inner Borders for premium feel -->
    <rect width="496" height="496" x="8" y="8" rx="104" ry="104" fill="none" stroke="#333333" stroke-width="2" />
    <rect width="504" height="504" x="4" y="4" rx="108" ry="108" fill="none" stroke="#111111" stroke-width="4" />
    
    <!-- Letter S -->
    <text x="50%" y="52%" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="340" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)" style="letter-spacing: -10px;">
        S
    </text>
    
    <!-- Subtext -->
    <text x="50%" y="82%" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#ffffff" letter-spacing="12" text-anchor="middle" dominant-baseline="middle" opacity="0.95" filter="url(#shadow)">
        SED
    </text>
</svg>
