<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dollar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circular Background with Shadow -->
  <circle cx="20" cy="20" r="18" fill="url(#icon-gradient)" filter="url(#shadow)"/>
  
  <!-- Inner Glow Effect -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Arrow Symbol (Direct) - More pronounced -->
  <path d="M 12 20 L 20 12 L 28 20 L 20 28 Z" fill="white" fill-opacity="0.95"/>
  <path d="M 20 12 L 28 20" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20 28 L 28 20" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dollar Symbol Circle with Glow -->
  <circle cx="27" cy="9" r="8" fill="url(#dollar-gradient)" filter="url(#glow)"/>
  <circle cx="27" cy="9" r="7" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Dollar Symbol -->
  <path d="M 27 5.5 L 27 12.5 M 24.5 7.5 L 29.5 7.5 M 24.5 10.5 L 29.5 10.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>